# Render Blueprint for the Momenta API.
# Docs: https://render.com/docs/blueprint-spec
#
# The database is NOT created here on purpose: use any PostgreSQL provider
# (for example Neon) and paste its connection string into DATABASE_URL.
services:
  - type: web
    name: momenta-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations, creates the admin (only if SEED_ADMIN_* are set), then starts the server.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        value: "*"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
